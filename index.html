<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Läsfart</title>
<style>
/* Typsnitten ligger i fonts/ (SIL OFL, se OFL-*.txt) så att inget hämtas från Google. */
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-400.woff2) format('woff2')}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-700.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
:root{
  --bg:#FFF6CF; --surface:#FFFFFF; --ink:#22306A; --muted:#5C6694; --line:#22306A; --shadow:#22306A;
  --sun:#FFC22E; --grass:#2FAE6B; --coral:#FF6B4A; --sky:#4BA3F5; --onbright:#22306A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141C44; --surface:#212C66; --ink:#FFF3C9; --muted:#B7BEE6; --line:#FFF3C9; --shadow:#05081E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141C44; --surface:#212C66; --ink:#FFF3C9; --muted:#B7BEE6; --line:#FFF3C9; --shadow:#05081E;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:18px;line-height:1.5;
}
#app{max-width:620px;margin:0 auto;padding:20px 18px 40px}
h1,h2,h3,.btn,.chip,.big{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif}
h1{font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;margin:8px 0 6px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;margin:28px 0 12px;font-weight:600}
h3{font-size:1.35rem;margin:0 0 4px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font-size:1.2rem;font-weight:600;padding:.7em 1.3em;border:3px solid var(--line);
  border-radius:18px;background:var(--sun);color:var(--onbright);
  box-shadow:4px 4px 0 var(--shadow);transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.green{background:var(--grass);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-width:2px;font-size:1rem;padding:.45em .9em}
.btn.wide{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:1rem;text-decoration:underline;text-underline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}

/* Profiler */
.players{display:grid;gap:12px}
.player{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 16px;
  box-shadow:4px 4px 0 var(--shadow);
}
.player .em{font-size:2.2rem;line-height:1}
.player b{font-family:"Fredoka",sans-serif;font-size:1.4rem;font-weight:600;display:block}
.newp{background:var(--surface);border:3px dashed var(--line);border-radius:20px;padding:16px;margin-top:14px}
.newp input{
  width:100%;font:inherit;font-size:1.2rem;padding:.55em .7em;border:3px solid var(--line);border-radius:14px;
  background:var(--bg);color:var(--ink);margin:6px 0 12px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  border:2px solid var(--line);border-radius:999px;padding:.35em .9em;background:transparent;font-size:1.05rem;font-weight:500;
}
.chip[aria-pressed="true"]{background:var(--sky);color:#fff;border-color:var(--sky)}

/* Fartbanan */
.track{
  margin:18px 0 8px;background:var(--surface);border:3px solid var(--line);border-radius:28px;
  padding:22px 14px 16px;box-shadow:5px 5px 0 var(--shadow);
}
.ladder{display:flex;justify-content:space-between;align-items:flex-end;gap:2px;position:relative}
.ladder::before{content:"";position:absolute;left:6%;right:6%;bottom:13px;height:6px;border-radius:3px;background:var(--muted);opacity:.25}
.rung{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;z-index:1}
.rung span{font-size:1.5rem;filter:grayscale(1);opacity:.35}
.rung.past span{filter:none;opacity:.9}
.rung.now span{font-size:3.4rem;filter:none;opacity:1;animation:hop .7s ease-out 1}
.rung i{width:14px;height:14px;border-radius:50%;margin-top:6px;background:var(--muted);opacity:.4}
.rung.past i,.rung.now i{background:var(--grass);opacity:1}
@keyframes hop{0%{transform:translateY(0) scale(.6)}50%{transform:translateY(-18px) scale(1.1)}100%{transform:none}}
.who{text-align:center;margin-top:14px}
.who .big{font-size:2rem;font-weight:700;line-height:1.1}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:10px auto 4px;max-width:320px}
.bar b{display:block;height:100%;background:var(--grass)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Fredoka",sans-serif;font-size:1.5rem;font-weight:600}
.stat small{color:var(--muted);font-size:.85rem}

.games{display:grid;gap:14px}
.game{
  display:block;width:100%;text-align:left;border:3px solid var(--line);border-radius:22px;
  padding:16px 18px;box-shadow:4px 4px 0 var(--shadow);color:var(--onbright);
}
.game:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.game.flash{background:var(--sun)}
.game.read{background:var(--sky);color:#fff}
.game .ic{font-size:2rem;float:right;margin-left:10px}
.game p{margin:0;font-size:1.05rem}

/* Spelscen */
.hud{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted);font-size:1rem}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.ok{background:var(--grass);border-color:var(--grass)}
.dots i.no{background:var(--coral);border-color:var(--coral)}
.stage{
  min-height:38vh;display:grid;place-items:center;text-align:center;
  background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:20px;margin-bottom:16px;
  font-size:clamp(2.2rem,11vw,4.2rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere;
}
.stage .fix{color:var(--muted);font-weight:400}
.stage .mask{color:var(--muted);letter-spacing:.05em}
.stage .note{font-size:1.2rem;font-weight:400;color:var(--muted)}
.stage .note b{display:block;font-size:2.4rem;color:var(--ink)}
.stage .count{font-family:"Fredoka",sans-serif;color:var(--coral);font-size:5rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  font-size:clamp(1.3rem,6vw,1.8rem);font-weight:700;padding:.7em .4em;border:3px solid var(--line);
  border-radius:18px;background:var(--surface);box-shadow:3px 3px 0 var(--shadow);overflow-wrap:anywhere;
}
.choice.ok{background:var(--grass);color:#fff;border-color:var(--grass)}
.choice.no{background:var(--coral);color:#fff;border-color:var(--coral)}
.qopts{display:grid;gap:10px}
.qopts .choice{font-size:1.2rem;font-weight:700;text-align:left;padding:.75em 1em}
.question{font-size:1.4rem;font-weight:700;margin:6px 0 14px}
.progress{height:10px;border-radius:6px;background:var(--muted);opacity:.25;overflow:hidden;margin-top:-6px}
.progress b{display:block;height:100%;width:0;background:var(--sky)}
.progwrap{position:relative;height:10px;border-radius:6px;overflow:hidden;margin:-4px 0 16px;border:2px solid var(--line)}
.progwrap b{display:block;height:100%;width:0;background:var(--sky)}

.speed{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0}
.speed .val{font-family:"Fredoka",sans-serif;font-size:2.6rem;font-weight:700;min-width:3ch;text-align:center;line-height:1}
.speed small{display:block;font-size:.9rem;color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400}
.round{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:1.8rem;font-weight:700;box-shadow:3px 3px 0 var(--shadow)}

.result{text-align:center;padding-top:20px}
.stars{font-size:3.6rem;letter-spacing:.1em;color:var(--sun);-webkit-text-stroke:2px var(--line);margin:10px 0}
.stars .off{color:transparent}
.result ul{list-style:none;padding:0;margin:16px 0 24px;font-size:1.15rem}
.result li{margin:6px 0}
.actions{display:grid;gap:12px;max-width:340px;margin:0 auto}
.rec{display:inline-block;background:var(--coral);color:#fff;font-family:"Fredoka",sans-serif;font-weight:600;border-radius:999px;padding:.2em .8em;margin-top:6px;transform:rotate(-3deg)}

.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 18px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
"use strict";

const LEVELS = {
  liten: {
    name: "Liten", ages: "6–8 år", flashStart: 700, wpmStart: 40, chunk: 1
  },
  mellan: {
    name: "Mellan", ages: "9–11 år", flashStart: 380, wpmStart: 110, chunk: 1
  },
  stor: {
    name: "Stor", ages: "12+ år", flashStart: 220, wpmStart: 170, chunk: 2
  }
};

/* Innehållet (texter.md och ord.md) laddas i boot() längst ner, med parsrarna i content.js */
let LOOKALIKE = {};

const ANIMALS = [
  [0,"🐌","Snigel"],[40,"🐢","Sköldpadda"],[70,"🐇","Kanin"],[110,"🦊","Räv"],
  [160,"🐎","Häst"],[220,"🐆","Gepard"],[300,"🦅","Pilgrimsfalk"]
];

/* ---------- Lagring ---------- */
const KEY = "lasfart-v1";
let S = { players: [], current: null };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw) || S; } catch (e) {}
if (!Array.isArray(S.players)) S.players = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function cur(){ return S.players.find(p => p.id === S.current) || null; }

/* ---------- Hjälpare ---------- */
const app = document.getElementById("app");
let G = null;          // pågående spelomgång
let newLevel = "mellan";
let confirmDelete = false;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function secs(ms){ return (ms / 1000).toFixed(2).replace(".", ",") + " s"; }
function today(){ const d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function yesterday(){ const d = new Date(Date.now() - 864e5); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function animalFor(wpm){ let idx = 0; ANIMALS.forEach((a, i) => { if (wpm >= a[0]) idx = i; }); return idx; }
function starStr(n){ let s = ""; for (let i = 0; i < 3; i++) s += i < n ? "★" : '<span class="off">★</span>'; return s; }

function award(p, stars){
  p.stars = (p.stars || 0) + stars;
  const t = today();
  if (p.lastDay !== t) { p.streak = p.lastDay === yesterday() ? (p.streak || 0) + 1 : 1; p.lastDay = t; }
}

/* ---------- Ordvarianter för Blixtordet ---------- */
const VOW = "aeiouyåäö";
const SIM = { b:"dp", d:"bt", p:"b", m:"n", n:"mh", k:"g", g:"kp", t:"fl", f:"t", l:"t", s:"z", r:"n", v:"w", h:"n", j:"i" };
function variants(w){
  const out = new Set(), L = w.length;
  for (let i = 1; i < L - 1; i++) if (w[i] !== w[i+1]) out.add(w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2));
  for (let i = 0; i < L; i++) {
    const c = w[i];
    if (VOW.includes(c)) for (const v of VOW) if (v !== c) out.add(w.slice(0,i) + v + w.slice(i+1));
    if (SIM[c]) for (const v of SIM[c]) out.add(w.slice(0,i) + v + w.slice(i+1));
  }
  if (L > 3) for (let i = 1; i < L; i++) out.add(w.slice(0,i) + w.slice(i+1));
  out.delete(w);
  return [...out];
}
function misspellings(w, n){
  const v = shuffle(variants(w));
  const same = v.filter(x => x.length === w.length);
  const pick = [];
  for (const x of same.concat(v)) { if (!pick.includes(x)) pick.push(x); if (pick.length === n) break; }
  return pick;
}
// Mest snarlika riktiga ord, ibland en felstavning av rätt ord
function distractors(w, n){
  const real = shuffle([...(LOOKALIKE[w] || [])]);
  const withMisspelling = real.length < n || Math.random() < 0.3;
  const out = real.slice(0, withMisspelling ? n - 1 : n);
  for (const x of misspellings(w, n)) { if (out.length >= n) break; if (!out.includes(x) && !real.includes(x)) out.push(x); }
  return out;
}

/* ---------- Skärmar ---------- */
function renderPlayers(){
  G = null; confirmDelete = false;
  const list = S.players.map(p => {
    const a = ANIMALS[animalFor(p.bestWpm || 0)];
    return `<button class="player" data-act="choose" data-id="${p.id}">
      <span class="em">${a[1]}</span>
      <span><b>${esc(p.name)}</b><span class="muted">${LEVELS[p.level].name}, ${p.stars || 0} ★</span></span>
    </button>`;
  }).join("");
  app.innerHTML = `
    <h1>Läsfart</h1>
    <p class="muted">Läs lite snabbare för varje runda – från snigel till pilgrimsfalk.</p>
    <h2>${S.players.length ? "Vem läser?" : "Vem ska börja läsa?"}</h2>
    <div class="players">${list}</div>
    <div class="newp">
      <label for="pname"><h3>${S.players.length ? "Ny läsare" : "Skriv ditt namn"}</h3></label>
      <input id="pname" maxlength="20" autocomplete="off" placeholder="Namn">
      <div class="chips" role="group" aria-label="Nivå">
        ${Object.entries(LEVELS).map(([k, l]) => `<button class="chip" data-act="newlevel" data-lv="${k}" aria-pressed="${k === newLevel}">${l.name} <span class="muted">${l.ages}</span></button>`).join("")}
      </div>
      <button class="btn green wide" data-act="add">Lägg till läsare</button>
    </div>`;
}

function renderHome(){
  G = null;
  const p = cur(); if (!p) return renderPlayers();
  const lv = LEVELS[p.level];
  const best = p.bestWpm || 0;
  const ai = animalFor(best);
  const next = ANIMALS[ai + 1];
  const pct = next ? Math.round(100 * (best - ANIMALS[ai][0]) / (next[0] - ANIMALS[ai][0])) : 100;
  app.innerHTML = `
    <div class="top">
      <button class="link" data-act="players">Byt läsare</button>
      <span class="muted">${lv.name} (${lv.ages})</span>
    </div>
    <h1>Hej ${esc(p.name)}!</h1>
    <div class="track">
      <div class="ladder">
        ${ANIMALS.map((a, i) => `<div class="rung ${i < ai ? "past" : i === ai ? "now" : ""}" title="${a[2]}: ${a[0]} ord per minut"><span>${a[1]}</span><i></i></div>`).join("")}
      </div>
      <div class="who">
        <div class="big">Du läser som en ${ANIMALS[ai][2].toLowerCase()}</div>
        <div class="muted">${best ? `Rekord: ${best} ord per minut` : "Spela Läsbanan för att sätta ditt första rekord"}</div>
        ${next ? `<div class="bar" aria-hidden="true"><b style="width:${Math.max(4, pct)}%"></b></div>
        <small class="muted">${next[0] - best} ord per minut kvar till ${next[2].toLowerCase()} ${next[1]}</small>` : `<div class="rec">Snabbast av alla!</div>`}
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${p.stars || 0} ★</b><small>stjärnor</small></div>
      <div class="stat"><b>${p.streak || 0} 🔥</b><small>dagar i rad</small></div>
      <div class="stat"><b>${p.bestFlashMs ? secs(p.bestFlashMs) : "–"}</b><small>snabbaste ord</small></div>
    </div>
    <div class="games">
      <button class="game read" data-act="read">
        <span class="ic">📖</span><h3>Läsbanan</h3>
        <p>Orden kommer ett i taget i din fart. Svara rätt så går det snabbare nästa gång.</p>
      </button>
      <button class="game flash" data-act="flash">
        <span class="ic">⚡</span><h3>Blixtordet</h3>
        <p>Ett ord blinkar förbi. Hann du se vilket det var?</p>
      </button>
    </div>
    <div class="foot">
      ${Object.entries(LEVELS).filter(([k]) => k !== p.level).map(([k, l]) => `<button class="link" data-act="setlevel" data-lv="${k}">Byt till nivå ${l.name}</button>`).join("")}
      <button class="link" data-act="delete">${confirmDelete ? `Tryck igen för att ta bort ${esc(p.name)}` : "Ta bort läsare"}</button>
    </div>`;
}

/* ---------- Blixtordet ---------- */
function startFlash(){
  const p = cur(), lv = LEVELS[p.level];
  G = { mode: "flash", i: 0, words: shuffle([...lv.words]).slice(0, 10), res: [], ms: p.flashMs || lv.flashStart, best: null };
  app.innerHTML = `
    <div class="top"><button class="link" data-act="home">Avbryt</button><span class="muted" id="msinfo"></span></div>
    <div class="hud"><span>Blixtordet</span><div class="dots" id="dots"></div></div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="choices" id="choices"></div>`;
  nextFlash();
}
function flashHud(){
  document.getElementById("dots").innerHTML = G.words.map((_, i) => `<i class="${G.res[i] === true ? "ok" : G.res[i] === false ? "no" : ""}"></i>`).join("");
  document.getElementById("msinfo").textContent = "Ordet syns i " + secs(G.ms);
}
function nextFlash(){
  const g = G; if (!g || g.mode !== "flash") return;
  if (g.i >= g.words.length) return endFlash();
  const w = g.words[g.i];
  g.answer = w; g.opts = shuffle([w, ...distractors(w, 3)]); g.locked = true;
  flashHud();
  const stage = document.getElementById("stage"), ch = document.getElementById("choices");
  stage.innerHTML = '<span class="fix">+</span>'; ch.innerHTML = "";
  setTimeout(() => {
    if (G !== g) return;
    stage.innerHTML = `<span class="word">${esc(w)}</span>`;
    requestAnimationFrame(t0 => {
      const tick = now => {
        if (G !== g) return;
        if (now - t0 >= g.ms - 8) {
          stage.innerHTML = `<span class="mask">${"▒".repeat(w.length)}</span>`;
          setTimeout(() => { if (G === g) showFlashChoices(); }, 150);
        } else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }, 700);
}
function showFlashChoices(){
  document.getElementById("stage").innerHTML = '<span class="note">Vilket ord var det?</span>';
  document.getElementById("choices").innerHTML = G.opts.map((o, i) => `<button class="choice" data-act="fpick" data-i="${i}">${esc(o)}</button>`).join("");
  G.locked = false;
}
function flashPick(i){
  const g = G; if (!g || g.locked) return; g.locked = true;
  const ok = g.opts[i] === g.answer;
  const btns = document.querySelectorAll("#choices .choice");
  btns.forEach((b, j) => { if (g.opts[j] === g.answer) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
  g.res[g.i] = ok;
  if (ok) { if (g.best === null || g.ms < g.best) g.best = g.ms; g.ms = Math.max(25, Math.round(g.ms * 0.85)); }
  else { g.ms = Math.min(1500, Math.round(g.ms * 1.25)); }
  document.getElementById("stage").innerHTML = ok ? '<span class="note"><b>Rätt!</b></span>' : `<span class="note">Det var<b>${esc(g.answer)}</b></span>`;
  g.i++;
  flashHud();
  setTimeout(nextFlash, ok ? 700 : 1400);
}
function endFlash(){
  const p = cur(), g = G;
  const correct = g.res.filter(Boolean).length;
  const stars = correct >= 9 ? 3 : correct >= 7 ? 2 : correct >= 5 ? 1 : 0;
  p.flashMs = g.ms;
  let record = false;
  if (g.best !== null && (!p.bestFlashMs || g.best < p.bestFlashMs)) { p.bestFlashMs = g.best; record = true; }
  award(p, stars); save();
  showResult({
    stars, record,
    title: correct >= 9 ? "Örnögon!" : correct >= 6 ? "Bra jobbat!" : "Bra försök!",
    lines: [`${correct} av 10 rätt`, g.best !== null ? `Snabbaste rätta ord: ${secs(g.best)}` : "Nästa gång blinkar orden lite långsammare", `Nästa runda börjar på ${secs(g.ms)}`],
    again: "flash"
  });
}

/* ---------- Läsbanan ---------- */
function startRead(){
  const p = cur(), lv = LEVELS[p.level];
  p.seen = p.seen || {};
  const titles = lv.texts.map(t => t.t);
  // Lästa texter sparas med rubrik, så att det håller även om texter.md ändras
  let seen = (p.seen[p.level] || []).map(s => typeof s === "number" ? titles[s] : s).filter(s => titles.includes(s));
  // Profiler från första versionen: räkna de texter de redan läst som lästa
  if (p.textIdx && p.textIdx[p.level]) {
    for (let i = 0; i < Math.min(p.textIdx[p.level], 4); i++) seen.unshift(titles[i]);
    delete p.textIdx[p.level];
  }
  seen = [...new Set(seen)];
  if (seen.length >= titles.length) seen = seen.slice(-1);
  p.seen[p.level] = seen;
  save();
  const pool = titles.map((_, i) => i).filter(i => !seen.includes(titles[i]));
  const idx = pool[Math.floor(Math.random() * pool.length)];
  G = { mode: "read", text: lv.texts[idx], idx, wpm: p.wpm || lv.wpmStart, qi: 0, correct: 0, chunk: lv.chunk };
  readIntro();
}
function readIntro(){
  app.innerHTML = `
    <div class="top"><button class="link" data-act="home">Tillbaka</button><span class="muted">Text ${cur().seen[cur().level].length + 1} av ${LEVELS[cur().level].texts.length}</span></div>
    <h1>${esc(G.text.t)}</h1>
    <p>Orden visas ett i taget mitt på skärmen. Läs noga – efteråt kommer tre frågor.</p>
    <div class="speed">
      <button class="round" data-act="slower" aria-label="Långsammare">−</button>
      <div><div class="val" id="wpm">${G.wpm}</div><small>ord per minut</small></div>
      <button class="round" data-act="faster" aria-label="Snabbare">+</button>
    </div>
    <button class="btn green wide" data-act="go">Starta</button>`;
}
function runRead(){
  const g = G;
  const words = g.text.body.split(/\s+/);
  const chunks = [];
  for (let i = 0; i < words.length; i += g.chunk) chunks.push(words.slice(i, i + g.chunk).join(" "));
  app.innerHTML = `
    <div class="top"><button class="link" data-act="home">Avbryt</button><span class="muted">${g.wpm} ord per minut</span></div>
    <div class="stage" id="stage"></div>
    <div class="progwrap"><b id="prog"></b></div>`;
  const stage = document.getElementById("stage"), prog = document.getElementById("prog");
  let n = 3;
  const count = () => {
    if (G !== g) return;
    if (n > 0) { stage.innerHTML = `<span class="count">${n}</span>`; n--; setTimeout(count, 650); }
    else step(0);
  };
  const base = 60000 / g.wpm;
  const step = i => {
    if (G !== g) return;
    if (i >= chunks.length) {
      prog.style.width = "100%";
      // Texten räknas som läst så fort den visats klart, även om frågorna avbryts
      const pp = cur(), list = pp.seen[pp.level];
      if (!list.includes(g.text.t)) list.push(g.text.t);
      save();
      setTimeout(() => { if (G === g) askQuestion(); }, 500);
      return;
    }
    const c = chunks[i];
    stage.innerHTML = `<span class="word">${esc(c)}</span>`;
    prog.style.width = Math.round(100 * (i + 1) / chunks.length) + "%";
    const nWords = c.split(" ").length;
    let d = base * nWords;
    if (/[.!?]$/.test(c)) d *= 1.6; else if (/[,;:–]$/.test(c)) d *= 1.3;
    if (c.replace(/[^\p{L}]/gu, "").length > 9 * nWords) d *= 1.2;
    setTimeout(() => step(i + 1), d);
  };
  count();
}
function askQuestion(){
  const q = G.text.q[G.qi];
  G.opts = shuffle(q.slice(1)); G.answer = q[1]; G.locked = false;
  app.innerHTML = `
    <div class="top"><span class="muted">Fråga ${G.qi + 1} av ${G.text.q.length}</span><span></span></div>
    <p class="question">${esc(q[0])}</p>
    <div class="qopts" id="choices">${G.opts.map((o, i) => `<button class="choice" data-act="qpick" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
}
function qPick(i){
  const g = G; if (!g || g.locked) return; g.locked = true;
  const ok = g.opts[i] === g.answer;
  if (ok) g.correct++;
  document.querySelectorAll("#choices .choice").forEach((b, j) => { if (g.opts[j] === g.answer) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
  setTimeout(() => {
    if (G !== g) return;
    g.qi++;
    if (g.qi < g.text.q.length) askQuestion(); else endRead();
  }, ok ? 700 : 1400);
}
function endRead(){
  const p = cur(), g = G, total = g.text.q.length;
  let next = g.wpm;
  if (g.correct === total) next = Math.round(g.wpm * 1.12);
  else if (g.correct < total - 1) next = Math.round(g.wpm * 0.9);
  next = Math.max(20, Math.min(600, next));
  let record = false;
  if (g.correct >= total - 1 && g.wpm > (p.bestWpm || 0)) {
    const before = animalFor(p.bestWpm || 0);
    p.bestWpm = g.wpm; record = true;
    g.newAnimal = animalFor(g.wpm) > before ? ANIMALS[animalFor(g.wpm)] : null;
  }
  p.wpm = next;
  const stars = g.correct;
  award(p, stars); save();
  const lines = [`${g.correct} av ${total} rätt på ${g.wpm} ord per minut`];
  if (g.newAnimal) lines.push(`Du är nu en ${g.newAnimal[2].toLowerCase()} ${g.newAnimal[1]}`);
  lines.push(next > g.wpm ? `Nästa text går snabbare: ${next} ord per minut` : next < g.wpm ? `Nästa text går lite lugnare: ${next} ord per minut` : `Nästa text går i samma fart: ${next} ord per minut`);
  if (!record && g.correct < total - 1) lines.push("Rekord räknas när du har högst ett fel");
  showResult({ stars, record, title: g.correct === total ? "Alla rätt!" : g.correct >= total - 1 ? "Snyggt läst!" : "Bra försök!", lines, again: "read" });
}

/* ---------- Resultat ---------- */
function showResult(r){
  G = null;
  app.innerHTML = `
    <div class="result">
      <h1>${esc(r.title)}</h1>
      <div class="stars" aria-label="${r.stars} av 3 stjärnor">${starStr(r.stars)}</div>
      ${r.record ? '<div class="rec">Nytt rekord!</div>' : ""}
      <ul>${r.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="actions">
        <button class="btn green" data-act="${r.again}">Spela igen</button>
        <button class="btn ghost" data-act="home">Till start</button>
      </div>
    </div>`;
}

/* ---------- Händelser ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act !== "delete") confirmDelete = false;
  switch (act) {
    case "newlevel":
      newLevel = b.dataset.lv;
      document.querySelectorAll('[data-act="newlevel"]').forEach(c => c.setAttribute("aria-pressed", c.dataset.lv === newLevel));
      break;
    case "add": {
      const inp = document.getElementById("pname");
      const name = inp.value.trim();
      if (!name) { inp.focus(); inp.placeholder = "Skriv ett namn först"; return; }
      const p = { id: Date.now().toString(36), name, level: newLevel, stars: 0, streak: 0, textIdx: {} };
      S.players.push(p); S.current = p.id; save(); renderHome(); break;
    }
    case "choose": S.current = b.dataset.id; save(); renderHome(); break;
    case "players": renderPlayers(); break;
    case "home": renderHome(); break;
    case "setlevel": {
      const p = cur(); p.level = b.dataset.lv;
      p.wpm = Math.max(p.wpm || 0, 0) ? p.wpm : LEVELS[p.level].wpmStart;
      p.flashMs = LEVELS[p.level].flashStart;
      save(); renderHome(); break;
    }
    case "delete":
      if (!confirmDelete) { confirmDelete = true; renderHome(); }
      else { S.players = S.players.filter(p => p.id !== S.current); S.current = null; confirmDelete = false; save(); renderPlayers(); }
      break;
    case "flash": startFlash(); break;
    case "fpick": flashPick(+b.dataset.i); break;
    case "read": startRead(); break;
    case "slower": G.wpm = Math.max(20, G.wpm - 10); document.getElementById("wpm").textContent = G.wpm; break;
    case "faster": G.wpm = Math.min(600, G.wpm + 10); document.getElementById("wpm").textContent = G.wpm; break;
    case "go": runRead(); break;
    case "qpick": qPick(+b.dataset.i); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Enter") document.querySelector('[data-act="add"]').click(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const btn = document.querySelectorAll("#choices .choice")[n - 1]; if (btn) btn.click(); }
});

async function boot(){
  app.innerHTML = '<p class="muted">Laddar texter …</p>';
  try {
    const [t, o] = await Promise.all(["texter.md", "ord.md"].map(f =>
      fetch(f, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(f); return r.text(); })));
    const texts = parseTexter(t), ord = parseOrd(o);
    for (const k of Object.keys(LEVELS)) {
      LEVELS[k].texts = texts[k] || [];
      LEVELS[k].words = ord.words[k] || [];
    }
    LOOKALIKE = ord.lookalike;
  } catch (e) {
    app.innerHTML = '<h1>Läsfart</h1><p>Kunde inte ladda texterna. Kontrollera anslutningen och ladda om sidan.</p>';
    return;
  }
  S.current && cur() ? renderHome() : renderPlayers();
}
boot();
</script>
</body>
</html>
